version: "3.9"
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cipher-chat
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cipher-chat"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/cipher-chat
      REDIS_URL: redis://redis:6379/0
      DJANGO_SETTINGS_MODULE: cipherchat.settings
      SECRET_KEY: dev-secret-change-me
      DEBUG: "1"
      ALLOWED_HOSTS: "*"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    ports: ["8000:8000"]
    command: >
      bash -lc "python manage.py migrate &&
                daphne -b 0.0.0.0 -p 8000 cipherchat.asgi:application"
